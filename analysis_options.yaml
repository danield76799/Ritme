analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Bestaande code heeft veel const-mogelijkheden; die gefaseerd aanzetten
    # voorkomt een lawine aan info-meldingen in één keer.
    prefer_const_constructors: false
    prefer_const_literals_to_create_immutables: false
    prefer_const_declarations: false

    # Stijlregels die veel ruis geven op bestaande code. Geen bugs.
    curly_braces_in_flow_control_structures: false
    avoid_slow_async_io: false
    avoid_print: false

    # Bekende follow-up: 31 plekken gebruiken context na een await zonder
    # mounted-check. Dat is een echte bugklasse, maar vereist per plek een
    # zorgvuldige guard; nu niet blind aanzetten.
    use_build_context_synchronously: true

    # Wel direct aan: echte fouten en veelvoorkomende valkuilen.
    cancel_subscriptions: true
    close_sinks: true
