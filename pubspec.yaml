name: ritme
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
# In macOS, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.3.9+1046

environment:
  sdk: ^3.7.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # Biometric authentication
  local_auth: ^2.3.0
  local_auth_android: ^1.0.46
  flutter_secure_storage: ^8.1.0

  # SQLite database (mobiel)
  sqflite: ^2.3.0
  path: ^1.8.3

  # Hive database (web)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  flutter_local_notifications: ^18.0.1
  fl_chart: ^1.2.0
  timezone: ^0.9.4
  flutter_timezone: ^5.0.2
  permission_handler: ^11.3.1
  share_plus: ^12.0.2
  pdf: ^3.11.1
  printing: ^5.13.2
  url_launcher: ^6.2.5
  file_picker: ^9.0.0
  path_provider: ^2.1.5
  shared_preferences: ^2.2.2
  package_info_plus: ^8.0.0
  google_fonts: ^6.2.0
  animations: ^2.0.0
  workmanager: ^0.9.0+3
  saf: ^2.1.2
  home_widget: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints
  # to encourage good coding practices, and a linter that identifies
  # common mistakes.
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

# Flutter Native Splash config
flutter_native_splash:
  color: "#4FB2C1"
  image: assets/logo_splash.png
  android: true
  ios: true
  web: false

# App Icon config
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo_icon.png"
  remove_alpha_ios: true

# Flutter Native Splash config
# (handled by flutter_native_splash)

flutter:
  uses-material-design: true
  # Enable flutter_localizations codegen
  generate: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/logo.jpg
    - assets/logo_icon.png
    - assets/logo_splash.png
    - assets/logo_hero.png
    # Manrope-ttf's als app-assets: de test-suite draait met
    # GoogleFonts.config.allowRuntimeFetching = false, en dan zoekt google_fonts
    # de font in de assets (in productie haalt de runtime-fetch de echte
    # statische gewichten op). Eén variable-font bestand gekopieerd onder
    # de gewichtsnamen die google_fonts vraagt; gewicht-onderscheid is voor
    # de contrasttests niet relevant.
    - assets/fonts/
