name: Build Release (APK + AAB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'
        channel: 'stable'

    - name: Get dependencies
      run: flutter pub get

    - name: Setup signing config
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks
        cat > android/key.properties << EOF
        storePassword=$KEYSTORE_PASSWORD
        keyPassword=$KEY_PASSWORD
        keyAlias=$KEY_ALIAS
        storeFile=release-keystore.jks
        EOF

    - name: Build APK (split per ABI)
      run: flutter build apk --release --split-per-abi

    - name: Build AAB
      run: flutter build appbundle --release

    - name: Verify APK signatures
      run: |
        BUILD_TOOLS_DIR=$(find $ANDROID_SDK_ROOT/build-tools -maxdepth 1 -type d | sort -V | tail -1)
        for apk in build/app/outputs/flutter-apk/*-release.apk; do
          echo "Verifying $apk"
          $BUILD_TOOLS_DIR/apksigner verify -v "$apk"
        done

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ritme-release-artifacts
        path: |
          build/app/outputs/flutter-apk/*-release.apk
          build/app/outputs/bundle/release/app-release.aab
        retention-days: 30

    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          build/app/outputs/bundle/release/app-release.aab
        tag_name: ritme-v${{ github.run_number }}-${{ github.run_id }}
        name: Ritme v${{ github.run_number }}
        body: |
          Ritme Android release

          - `app-arm64-v8a-release.apk` — moderne telefoons
          - `app-armeabi-v7a-release.apk` — oudere telefoons
          - `app-release.aab` — Play Store bundle
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
