name: Build Release (APK + AAB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.47.7'
        channel: 'stable'

    - name: Get dependencies
      run: flutter pub get

    # Versie: code én naam worden allebei per run opgehoogd, zodat Play Store
    # nooit een gebruikte code krijgt en het versienummer zichtbaar meestijgt.
    #   code = 1000 + run_number            (monotoon, uniek)
    #   naam = 1.3.<5 + runs sinds basis>   (patch-bump per release)
    - name: Compute version
      id: ver
      env:
        BASE_RUN_15: '192'   # run 192 = 1.5.0, daarna oplopend
      run: |
        CODE=$((1000 + ${{ github.run_number }}))
        PATCH=$(( ${{ github.run_number }} - BASE_RUN_15 ))
        NAME="1.5.${PATCH}"
        echo "code=$CODE" >> "$GITHUB_OUTPUT"
        echo "name=$NAME" >> "$GITHUB_OUTPUT"
        echo "Version: $NAME (code $CODE)"

    - name: Setup signing config
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks
        cat > android/key.properties << EOF
        storePassword=$KEYSTORE_PASSWORD
        keyPassword=$KEY_PASSWORD
        keyAlias=$KEY_ALIAS
        storeFile=release-keystore.jks
        EOF

    - name: Build APK (split per ABI)
      run: flutter build apk --release --split-per-abi --build-name=${{ steps.ver.outputs.name }} --build-number=${{ steps.ver.outputs.code }}

    - name: Build AAB
      run: flutter build appbundle --release --build-name=${{ steps.ver.outputs.name }} --build-number=${{ steps.ver.outputs.code }}

    - name: Verify APK signatures
      run: |
        BUILD_TOOLS_DIR=$(find $ANDROID_SDK_ROOT/build-tools -maxdepth 1 -type d | sort -V | tail -1)
        for apk in build/app/outputs/flutter-apk/*-release.apk; do
          echo "Verifying $apk"
          $BUILD_TOOLS_DIR/apksigner verify -v "$apk"
        done

    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          build/app/outputs/bundle/release/app-release.aab
        tag_name: ritme-v${{ github.run_number }}-${{ github.run_id }}
        name: Ritme ${{ steps.ver.outputs.name }}
        body: |
          Ritme Android release

          - `app-arm64-v8a-release.apk` — moderne telefoons
          - `app-armeabi-v7a-release.apk` — oudere telefoons
          - `app-release.aab` — Play Store bundle

          Versie: **${{ steps.ver.outputs.name }}** (code ${{ steps.ver.outputs.code }})
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Automatische upload naar de Play Store (internal track). De productie-
    # track blijft bewust handmatig: die vereist meestal een expliciete
    # 'Send for review'-actie van de developer.
    #
    # Eenmalige setup: zet de service-account JSON als repository-secret:
    #   gh secret set PLAY_SERVICE_ACCOUNT_JSON < play-service-account.json
    # Zonder secret wordt deze stap overgeslagen (geen fout).
    - name: Upload naar Play (internal)
      if: github.ref == 'refs/heads/main'
      # Een Play-storing mag de build/release niet laten falen.
      continue-on-error: true
      env:
        PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      run: |
        if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
          echo "Geen PLAY_SERVICE_ACCOUNT_JSON-secret; Play-upload overgeslagen."
          exit 0
        fi
        python3 -m pip install --quiet google-api-python-client google-auth
        python3 scripts/play_upload.py \
          --aab build/app/outputs/bundle/release/app-release.aab \
          --package com.ritme.ritme.v2 \
          --track internal \
          --name "Ritme ${{ steps.ver.outputs.name }}"
