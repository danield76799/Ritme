name: Build Release (APK + AAB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.47.7'
        channel: 'stable'

    - name: Get dependencies
      run: flutter pub get

    # Versie: code én naam worden allebei per run opgehoogd, zodat Play Store
    # nooit een gebruikte code krijgt en het versienummer zichtbaar meestijgt.
    #   code = 1000 + run_number            (monotoon, uniek)
    #   naam = 1.3.<5 + runs sinds basis>   (patch-bump per release)
    - name: Compute version
      id: ver
      env:
        BASE_RUN: '39'
        BASE_PATCH: '5'
      run: |
        CODE=$((1000 + ${{ github.run_number }}))
        PATCH=$((BASE_PATCH + ${{ github.run_number }} - BASE_RUN))
        NAME="1.3.${PATCH}"
        echo "code=$CODE" >> "$GITHUB_OUTPUT"
        echo "name=$NAME" >> "$GITHUB_OUTPUT"
        echo "Version: $NAME (code $CODE)"

    - name: Setup signing config
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks
        cat > android/key.properties << EOF
        storePassword=$KEYSTORE_PASSWORD
        keyPassword=$KEY_PASSWORD
        keyAlias=$KEY_ALIAS
        storeFile=release-keystore.jks
        EOF

    - name: Build APK (split per ABI)
      run: flutter build apk --release --split-per-abi --build-name=${{ steps.ver.outputs.name }} --build-number=${{ steps.ver.outputs.code }}

    - name: Build AAB
      run: flutter build appbundle --release --build-name=${{ steps.ver.outputs.name }} --build-number=${{ steps.ver.outputs.code }}

    - name: Verify APK signatures
      run: |
        BUILD_TOOLS_DIR=$(find $ANDROID_SDK_ROOT/build-tools -maxdepth 1 -type d | sort -V | tail -1)
        for apk in build/app/outputs/flutter-apk/*-release.apk; do
          echo "Verifying $apk"
          $BUILD_TOOLS_DIR/apksigner verify -v "$apk"
        done

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'

    - name: Install Fastlane
      run: gem install fastlane

    - name: Setup Play Console service account key
      env:
        PLAY_JSON_KEY: ${{ secrets.PLAY_JSON_KEY }}
      run: |
        if [ -n "${PLAY_JSON_KEY}" ]; then
          echo "${PLAY_JSON_KEY}" > android/fastlane/keys.json
          echo "Keys written."
        else
          echo "PLAY_JSON_KEY secret is empty; skipping metadata upload."
          exit 0
        fi

    - name: Upload metadata (Fastlane)
      if: ${{ secrets.PLAY_JSON_KEY != '' }}
      run: |
        cd android && fastlane deploy_internal_test

    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          build/app/outputs/bundle/release/app-release.aab
        tag_name: ritme-v${{ github.run_number }}-${{ github.run_id }}
        name: Ritme ${{ steps.ver.outputs.name }}
        body: |
          Ritme Android release

          - `app-arm64-v8a-release.apk` — moderne telefoons
          - `app-armeabi-v7a-release.apk` — oudere telefoons
          - `app-release.aab` — Play Store bundle

          Versie: **${{ steps.ver.outputs.name }}** (code ${{ steps.ver.outputs.code }})
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
