name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'
        channel: 'stable'

    - name: Get dependencies
      run: flutter pub get

    - name: Build Debug APK
      run: flutter build apk --debug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: ritme-debug-apk
        path: build/app/outputs/flutter-apk/app-debug.apk
        retention-days: 7

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: build/app/outputs/flutter-apk/app-debug.apk
        tag_name: debug-v${{ github.run_number }}
        name: Ritme Debug v${{ github.run_number }}
        body: |
          Debug APK for testing (unsigned, larger file)
          
          **Note:** This is a debug build, not optimized for release.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
