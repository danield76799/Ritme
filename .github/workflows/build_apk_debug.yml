name: Build Android AAB (Ritme)

on:
  push:
    branches: [ main, temp-build-5e68ea8 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'
        channel: 'stable'
        cache: true
    
    - name: Get dependencies
      run: flutter pub get
    
    - name: Build AAB
      run: |
        flutter build appbundle --release
        echo "AAB built successfully"
    
    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ritme-aab
        path: build/app/outputs/bundle/release/app-release.aab
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: build/app/outputs/bundle/release/app-release.aab
        tag_name: aab-${{ github.run_number }}
        name: Ritme AAB Build ${{ github.run_number }}
        body: |
          ## Ritme - AAB Build
          
          **Installatie:**
          - Download de AAB
          - Gebruik [bundletool](https://developer.android.com/studio/command-line/bundletool) of installeer via Google Play Console
          
          **Let op:** Dit is een release AAB voor testen.
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}