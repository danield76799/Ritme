name: Build Android AAB (Ritme)

on:
  push:
    branches: [ main, temp-build-5e68ea8 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'
        channel: 'stable'
        cache: true
    
    - name: Auto-increment version code
      run: |
        # Get current version from pubspec.yaml
        CURRENT_VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: //' | sed 's/+//g')
        VERSION_NAME=$(echo $CURRENT_VERSION | cut -d'+' -f1)
        VERSION_CODE=$(echo $CURRENT_VERSION | cut -d'+' -f2)
        
        # Increment version code
        NEW_VERSION_CODE=$((VERSION_CODE + 1))
        NEW_VERSION="${VERSION_NAME}+${NEW_VERSION_CODE}"
        
        # Update pubspec.yaml
        sed -i "s/^version: .*/version: ${NEW_VERSION}/" pubspec.yaml
        
        echo "Version updated: ${CURRENT_VERSION} -> ${NEW_VERSION}"
        echo "NEW_VERSION=${NEW_VERSION}" >> $GITHUB_ENV
    
    - name: Commit version bump
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add pubspec.yaml
        git commit -m "ci: auto-increment version code to ${{ env.NEW_VERSION }}" || echo "No changes to commit"
        git push origin ${{ github.ref_name }} || echo "Push failed"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build AAB
      run: |
        flutter build appbundle --debug
        echo "AAB built successfully"
    
    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ritme-aab
        path: build/app/outputs/bundle/release/app-release.aab
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: build/app/outputs/bundle/release/app-release.aab
        tag_name: aab-${{ github.run_number }}
        name: Ritme AAB Build ${{ github.run_number }}
        body: |
          ## Ritme - AAB Build
          
          **Installatie:**
          - Download de AAB
          - Gebruik [bundletool](https://developer.android.com/studio/command-line/bundletool) of installeer via Google Play Console
          
          **Let op:** Dit is een release AAB voor testen.
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}