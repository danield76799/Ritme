name: Build Android APK Debug (Ritme)

on:
  push:
    branches: [ main, temp-build-5e68ea8 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'
        channel: 'stable'
        cache: true
    
    - name: Get dependencies
      run: flutter pub get
    
    - name: Build debug APK
      run: |
        flutter build apk --debug
        echo "Debug APK built successfully"
    
    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ritme-debug-apk
        path: build/app/outputs/flutter-apk/*-debug.apk
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: build/app/outputs/flutter-apk/*-debug.apk
        tag_name: debug-${{ github.run_number }}
        name: Ritme Debug Build ${{ github.run_number }}
        body: |
          ## Ritme - Debug Build
          
          **Let op:** Dit is een debug build voor testen.
          
          **Installatie instructies:**
          - **Deïnstalleer** eerst de oude Ritme app (indien aanwezig)
          - Installeer dan de nieuwe APK
          
          **Beschikbare APKs:**
          - `app-arm64-v8a-debug.apk` - Voor de meeste moderne Android devices
          - `app-armeabi-v7a-debug.apk` - Voor oudere Android devices
          - `app-x86_64-debug.apk` - Voor Android emulators
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
