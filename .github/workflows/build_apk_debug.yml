name: Build Android APK Debug (Ritme)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'
        channel: 'stable'
        cache: true
    
    - name: Get dependencies
      run: flutter pub get
    
    - name: Build debug APKs (per ABI)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        flutter build apk --debug --split-per-abi
        
        # Sign debug APKs with release keystore for consistent signing
        echo "$KEYSTORE_BASE64" | base64 -d > /tmp/debug.keystore
        
        for apk in build/app/outputs/flutter-apk/*-debug.apk; do
          echo "Signing $apk"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore /tmp/debug.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$apk" "$KEY_ALIAS"
        done
        
        echo "All debug APKs signed with consistent keystore"
    
    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ritme-debug-apk
        path: build/app/outputs/flutter-apk/*-debug.apk
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: build/app/outputs/flutter-apk/*-debug.apk
        tag_name: debug-${{ github.run_number }}
        name: Ritme Debug Build ${{ github.run_number }}
        body: |
          ## Ritme - Debug Build
          
          **Let op:** Dit is een debug build voor testen.
          
          **Beschikbare APKs:**
          - `app-arm64-v8a-debug.apk` - Voor de meeste moderne Android devices
          - `app-armeabi-v7a-debug.apk` - Voor oudere Android devices
          - `app-x86_64-debug.apk` - Voor Android emulators
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}