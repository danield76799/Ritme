name: Build Android App Bundle (Play Store)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Setup Flutter
      run: |
        git clone --depth 1 https://github.com/flutter/flutter.git -b stable
        echo "$PWD/flutter/bin" >> $GITHUB_PATH

    - name: Cache Flutter dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.pub-cache
          ~/.gradle/caches
        key: flutter-deps-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          flutter-deps-${{ runner.os }}-

    - name: Auto-increment version code
      run: |
        # Extract current version from pubspec.yaml
        CURRENT_VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: //')
        echo "Current version: $CURRENT_VERSION"
        
        # Split into version name and code
        VERSION_NAME=$(echo $CURRENT_VERSION | cut -d'+' -f1)
        VERSION_CODE=$(echo $CURRENT_VERSION | cut -d'+' -f2)
        
        # Increment version code
        NEW_VERSION_CODE=$((VERSION_CODE + 1))
        NEW_VERSION="${VERSION_NAME}+${NEW_VERSION_CODE}"
        
        echo "New version: $NEW_VERSION"
        
        # Update pubspec.yaml
        sed -i "s/^version: .*/version: ${NEW_VERSION}/" pubspec.yaml
        
        # Show result
        grep "^version:" pubspec.yaml

    - name: Commit version bump
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add pubspec.yaml
        git diff --cached --quiet || git commit -m "Auto-increment version code to +${NEW_VERSION_CODE}"
        
    - name: Push version bump
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}

    - name: Clean Flutter build
      run: |
        export PATH="$PWD/flutter/bin:$PATH"
        flutter clean
        rm -rf build/ .dart_tool/ .flutter-plugins*

    - name: Get dependencies
      run: |
        export PATH="$PWD/flutter/bin:$PATH"
        flutter pub get
        flutter pub upgrade

    - name: Build App Bundle
      run: |
        export PATH="$PWD/flutter/bin:$PATH"
        flutter build appbundle --release

    - name: Sign AAB
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        # Decode keystore
        echo "$KEYSTORE_BASE64" | base64 -d > /tmp/keystore.jks
        
        # Get build tools
        BUILD_TOOLS_VERSION=$(ls $ANDROID_SDK_ROOT/build-tools/ | sort -V | tail -n 1)
        BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION"
        
        # Sign with apksigner (modern, supports v2/v3 signing)
        $BUILD_TOOLS/apksigner sign \
          --ks /tmp/keystore.jks \
          --ks-pass pass:"$KEYSTORE_PASSWORD" \
          --key-pass pass:"$KEY_PASSWORD" \
          --ks-key-alias "$KEY_ALIAS" \
          --v2-signing-enabled true \
          --v3-signing-enabled true \
          build/app/outputs/bundle/release/app-release.aab
        
        # Verify
        $BUILD_TOOLS/apksigner verify build/app/outputs/bundle/release/app-release.aab

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: ritme-aab-signed
        path: build/app/outputs/bundle/release/app-release.aab
        retention-days: 7

    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        files: build/app/outputs/bundle/release/app-release.aab
        tag_name: playstore-v${{ github.run_number }}
        name: Play Store Release v${{ github.run_number }}
        body: |
          Play Store App Bundle (AAB) voor Ritme
          
          ## Upload naar Play Store
          1. Download `app-release.aab`
          2. Ga naar https://play.google.com/console
          3. Upload de AAB bij "App bundles"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}