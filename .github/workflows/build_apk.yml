name: Build Android APK (Ritme)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: read
  checks: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'
        channel: 'stable'
        cache: true
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: Get dependencies
      run: flutter pub get
    
    - name: Build unsigned APK
      run: |
        flutter build apk --release --split-per-abi || {
          echo "Build failed, trying without split-per-abi..."
          flutter build apk --release
        }
    
    - name: Sign APKs
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: *** secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: *** secrets.KEY_PASSWORD }}
      run: |
        set -e
        
        # Check if keystore secret is available
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "WARNING: KEYSTORE_BASE64 not set, skipping signing"
          exit 0
        fi
        
        # Decode keystore
        echo "$KEYSTORE_BASE64" | base64 -d > /tmp/keystore.jks
        
        # Find zipalign
        ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | head -1)
        echo "Found zipalign at: $ZIPALIGN"
        
        # Sign all APKs
        for apk in build/app/outputs/flutter-apk/*-release.apk; do
          echo "Signing $apk"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore /tmp/keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$apk" "$KEY_ALIAS"
          
          # Align APK
          ALIGNED="${apk%.apk}-aligned.apk"
          "$ZIPALIGN" -f 4 "$apk" "$ALIGNED"
          mv "$ALIGNED" "$apk"
        done
        
        echo "All APKs signed and aligned successfully"
      continue-on-error: true
    
    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ritme-release-apk
        path: build/app/outputs/flutter-apk/*-release.apk
    
    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        files: build/app/outputs/flutter-apk/*-release.apk
        tag_name: v1.2.1-build${{ github.run_number }}
        name: Ritme v1.2.1 (Build ${{ github.run_number }})
        body: |
          ## Ritme - SRT Tracker v1.2.1
          
          **Build info:**
          - Build number: ${{ github.run_number }}
          - Commit: ${{ github.sha }}
          - Type: Signed release build
          
          **Let op:** Dit is een automatische build.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: *** secrets.GITHUB_TOKEN }}