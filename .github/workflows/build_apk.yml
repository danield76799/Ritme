name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'
        channel: 'stable'

    - name: Get dependencies
      run: flutter pub get

    - name: Build APK (split per ABI)
      run: flutter build apk --release --split-per-abi

    - name: Sign APKs
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > /tmp/keystore.jks
        for apk in build/app/outputs/flutter-apk/*-release.apk; do
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore /tmp/keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$apk" "$KEY_ALIAS"
        done

    - name: Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: ritme-apks
        path: build/app/outputs/flutter-apk/*-release.apk
        retention-days: 30

    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        files: build/app/outputs/flutter-apk/*-release.apk
        tag_name: apk-v${{ github.run_number }}
        name: Ritme APK v${{ github.run_number }}
        body: |
          Ritme Android APKs
          
          - `app-arm64-v8a-release.apk` - Modern phones (recommended)
          - `app-armeabi-v7a-release.apk` - Older phones
          - `app-x86_64-release.apk` - Emulators/x86 devices
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
