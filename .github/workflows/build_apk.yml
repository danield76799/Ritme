name: Build Android APK (Ritme)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: read
  checks: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.27.4'
        channel: 'stable'
        cache: true
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: Accept Android licenses
      run: yes | flutter doctor --android-licenses || true
    
    - name: Get dependencies
      run: |
        flutter pub get
    
    - name: Build APK
      run: |
        echo "=== Ritme Build Starting ==="
        flutter --version
        flutter doctor || true
        
        echo "=== Starting Build ==="
        # Build with error tolerance
        flutter build apk --release --no-tree-shake-icons 2>&1 | tee build.log || {
          echo "=== BUILD FAILED - checking for APK anyway ==="
          # Check if APK was created despite errors
          if [ -f "build/app/outputs/apk/release/app-release.apk" ]; then
            echo "APK found despite build errors!"
            exit 0
          fi
          echo "Last 200 lines of build log:"
          tail -200 build.log
          exit 1
        }
        
        echo "=== Build Output ==="
        find build/app/outputs -name "*.apk" -type f || true
        ls -la build/app/outputs/apk/release/ || true
        ls -la build/app/outputs/flutter-apk/ || true
    
    - name: Sign APK
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        # Check if keystore secret is available
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "WARNING: KEYSTORE_BASE64 not set, skipping signing"
          exit 0
        fi
        
        # Decode keystore
        echo "$KEYSTORE_BASE64" | base64 -d > /tmp/keystore.jks
        
        # Find zipalign
        ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | head -1)
        echo "Found zipalign at: $ZIPALIGN"
        
        # Find and sign APKs
        APK_FOUND=false
        for apk in build/app/outputs/*/release/*.apk build/app/outputs/flutter-apk/*.apk; do
          if [ -f "$apk" ]; then
            echo "Signing $apk"
            jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore /tmp/keystore.jks \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              "$apk" "$KEY_ALIAS"
            
            # Align APK
            ALIGNED="${apk%.apk}-aligned.apk"
            "$ZIPALIGN" -f 4 "$apk" "$ALIGNED"
            mv "$ALIGNED" "$apk"
            APK_FOUND=true
          fi
        done
        
        if [ "$APK_FOUND" = false ]; then
          echo "WARNING: No APKs found to sign"
        else
          echo "All APKs signed and aligned successfully"
        fi
      continue-on-error: true
    
    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ritme-release-apk
        path: |
          build/app/outputs/apk/release/*.apk
          build/app/outputs/flutter-apk/*.apk
        if-no-files-found: warn
    
    - name: Create Release
      if: github.ref == 'refs/heads/main' && always()
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/app/outputs/apk/release/*.apk
          build/app/outputs/flutter-apk/*.apk
        tag_name: v1.3.4-build${{ github.run_number }}
        name: Ritme v1.3.4 (Build ${{ github.run_number }})
        body: |
          ## Ritme - SRT Tracker v1.3.4
          
          **Build info:**
          - Build number: ${{ github.run_number }}
          - Commit: ${{ github.sha }}
          - Type: Release build
          
          **Wijzigingen in deze build:**
          - Workflow verbeterd voor betrouwbaardere builds
          - Flutter 3.27.4 gebruikt (compatible met Dart 3.7.0)
          - APK signing verbeterd
          
          **Let op:** Dit is een automatische build.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
