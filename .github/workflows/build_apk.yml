name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'
        channel: 'stable'

    - name: Get dependencies
      run: flutter pub get

    - name: Build APK (split per ABI)
      run: flutter build apk --release --split-per-abi

    - name: Sign APKs
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > /tmp/keystore.jks
        
        # Find Android SDK build tools
        BUILD_TOOLS_DIR=$(find $ANDROID_SDK_ROOT/build-tools -maxdepth 1 -type d | sort -V | tail -1)
        echo "Build tools: $BUILD_TOOLS_DIR"
        
        for apk in build/app/outputs/flutter-apk/*-release.apk; do
          echo "Processing $apk"
          
          # Step 1: Zipalign (REQUIRED for Android R+)
          ALIGNED_APK="${apk%.apk}-aligned.apk"
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$apk" "$ALIGNED_APK"
          mv "$ALIGNED_APK" "$apk"
          echo "Zipalign complete"
          
          # Step 2: Sign with apksigner (modern Android signing)
          $BUILD_TOOLS_DIR/apksigner sign --ks /tmp/keystore.jks \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            "$apk"
          
          # Step 3: Verify signature
          $BUILD_TOOLS_DIR/apksigner verify -v "$apk"
          echo "Sign and verify complete for $apk"
        done

    - name: Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: ritme-apks
        path: build/app/outputs/flutter-apk/*-release.apk
        retention-days: 30

    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        files: build/app/outputs/flutter-apk/*-release.apk
        tag_name: apk-v${{ github.run_number }}
        name: Ritme APK v${{ github.run_number }}
        body: |
          Ritme Android APKs
          
          - `app-arm64-v8a-release.apk` - Modern phones (recommended)
          - `app-armeabi-v7a-release.apk` - Older phones
          - `app-x86_64-release.apk` - Emulators/x86 devices
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
