name: Build Android APK (Ritme)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: read
  checks: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'
        channel: 'stable'
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses || true
      
    - name: Install Android SDK components
      run: |
        sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
    
    - name: Get dependencies
      run: flutter pub get
    
    - name: Build unsigned APK (debug)
      run: flutter build apk --debug
    
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ritme-debug-apk
        path: build/app/outputs/flutter-apk/app-debug.apk
    
    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        files: build/app/outputs/flutter-apk/app-debug.apk
        tag_name: v1.2.1-debug-build${{ github.run_number }}
        name: Ritme v1.2.1 Debug (Build ${{ github.run_number }})
        body: |
          ## Ritme - SRT Tracker v1.2.1
          
          **Nieuwe features:**
          - Medicatie reminders met tijdstip
          - Push notificaties voor medicatie
          - Database reset functie
          - Delete knop voor medicatie
          
          **Build info:**
          - Build number: ${{ github.run_number }}
          - Commit: ${{ github.sha }}
          
          **Let op:** Dit is een automatische build.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}