name: Build Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'
        channel: 'stable'

    - name: Get dependencies
      run: flutter pub get

    - name: Build APK (split per ABI)
      run: flutter build apk --release --split-per-abi

    - name: Sign and verify APKs
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > /tmp/keystore.jks
        # Verify keystore
        keytool -list -keystore /tmp/keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS"
        # Sign APKs with apksigner (Android's official signing tool)
        for apk in build/app/outputs/flutter-apk/*-release.apk; do
          echo "Signing $apk"
          # Find apksigner in Android SDK
          APK_SIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -V | tail -1)
          if [ -z "$APK_SIGNER" ]; then
            echo "apksigner not found, falling back to jarsigner"
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore /tmp/keystore.jks \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              "$apk" "$KEY_ALIAS"
            jarsigner -verify -verbose "$apk"
          else
            echo "Using apksigner: $APK_SIGNER"
            $APK_SIGNER sign --ks /tmp/keystore.jks \
              --ks-pass pass:"$KEYSTORE_PASSWORD" \
              --key-pass pass:"$KEY_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              "$apk"
            # Verify signature with apksigner
            $APK_SIGNER verify -v "$apk"
          fi
        done

    - name: Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: ritme-release-apks
        path: build/app/outputs/flutter-apk/*-release.apk
        retention-days: 30

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: build/app/outputs/flutter-apk/*-release.apk
        tag_name: release-v${{ github.run_number }}
        name: Ritme Release v${{ github.run_number }}
        body: |
          Ritme Android Release APKs
          
          - `app-arm64-v8a-release.apk` - Modern phones (recommended)
          - `app-armeabi-v7a-release.apk` - Older phones
          - `app-x86_64-release.apk` - Emulators/x86 devices
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
