name: Build Ritme - Debug APK + Signed AAB

on:
  push:
    branches: [ main, temp-build-5e68ea8 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'
        channel: 'stable'
        cache: true
    
    - name: Get dependencies
      run: flutter pub get
    
    - name: Build debug APK
      run: |
        flutter build apk --debug
        echo "Debug APK built successfully"
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: ritme-debug-apk
        path: build/app/outputs/flutter-apk/*-debug.apk

  build-release:
    name: Build Signed AAB
    runs-on: ubuntu-latest
    needs: build-debug
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'
        channel: 'stable'
        cache: true
    
    - name: Get dependencies
      run: flutter pub get
    
    - name: Build release AAB
      run: |
        flutter build appbundle --release
        echo "Release AAB built successfully"
    
    - name: Sign AAB
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: build/app/outputs/bundle/release
        signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
        alias: ${{ secrets.KEY_ALIAS }}
        keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      env:
        BUILD_TOOLS_VERSION: "34.0.0"
    
    - name: Upload Signed AAB
      uses: actions/upload-artifact@v4
      with:
        name: ritme-signed-aab
        path: build/app/outputs/bundle/release/*.aab
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/app/outputs/bundle/release/*.aab
        tag_name: v${{ github.run_number }}
        name: Ritme Release ${{ github.run_number }}
        body: |
          ## Ritme - Release Build
          
          **Bestanden:**
          - `*.aab` - Android App Bundle (voor Play Store)
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
