<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E0F2F1"/>
      <stop offset="100%" style="stop-color:#B2DFDB"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#004D40" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="64" y="64" width="896" height="896" rx="224" ry="224" fill="url(#bg)" filter="url(#shadow)"/>
  
  <!-- Teal circle accent -->
  <circle cx="512" cy="512" r="320" fill="#00897B" opacity="0.1"/>
  
  <!-- Medical cross -->
  <g transform="translate(512, 480)">
    <!-- Vertical bar -->
    <rect x="-48" y="-160" width="96" height="320" rx="24" fill="#00897B"/>
    <!-- Horizontal bar -->
    <rect x="-160" y="-48" width="320" height="96" rx="24" fill="#00897B"/>
    
    <!-- Heart in center -->
    <path d="M0,-20 C-30,-50 -80,-20 -80,20 C-80,60 0,100 0,100 C0,100 80,60 80,20 C80,-20 30,-50 0,-20Z" 
          fill="#FFFFFF" transform="translate(0, -10) scale(0.35)"/>
    
    <!-- Pulse line -->
    <polyline points="-200,80 -120,80 -100,40 -80,120 -60,80 0,80 40,80 60,40 80,120 100,80 200,80" 
              fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>
  
  <!-- Subtle ring -->
  <circle cx="512" cy="512" r="280" fill="none" stroke="#00897B" stroke-width="4" opacity="0.2"/>
</svg>